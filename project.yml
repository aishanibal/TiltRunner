name: TiltRunner
options:
  bundleIdPrefix: com.aishanibal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  TiltRunner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TiltRunner
    resources:
      - path: TiltRunner/Resources/Assets.xcassets
    info:
      path: TiltRunner/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - armv7
        CFBundleDisplayName: TiltRunner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aishanibal.TiltRunner
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
