name: TiltRunner
options:
  bundleIdPrefix: com.aishanibal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  FirebaseFirestore:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  # 1.38+ requires Swift tools 6.2 (Xcode 16.3+). Pin for Xcode 16.2.
  swift-protobuf:
    url: https://github.com/apple/swift-protobuf.git
    exactVersion: 1.37.0

targets:
  TiltRunner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TiltRunner
    resources:
      - path: TiltRunner/Resources/Assets.xcassets
      - path: TiltRunner/Resources/GoogleService-Info.plist
    info:
      path: TiltRunner/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - armv7
        CFBundleDisplayName: TiltRunner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aishanibal.TiltRunner
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: FirebaseFirestore
        product: FirebaseCore
      - package: FirebaseFirestore
        product: FirebaseFirestore
      - package: swift-protobuf
        product: SwiftProtobuf
